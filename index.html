<script type="module">
  // Conexión a Firebase / Firestore: guarda una copia de los datos en la nube
  // para que no se pierdan si el teléfono borra el almacenamiento local.
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC69lkoZW-dfD_W55T54hMMJRwhXmCAjpo",
    authDomain: "jdventas-a6afa.firebaseapp.com",
    projectId: "jdventas-a6afa",
    storageBucket: "jdventas-a6afa.firebasestorage.app",
    messagingSenderId: "924830739264",
    appId: "1:924830739264:web:e1980ec2a8e2484075a8a5"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const refDatos = doc(db, 'jdventas', 'principal');

  // Estas funciones quedan colgadas de "window" para que el resto de la app
  // (que es un script normal, no un módulo) las pueda usar.
  window.nubeGuardar = async function(datos) {
    try {
      await setDoc(refDatos, { ...datos, actualizado: Date.now() });
      return true;
    } catch (e) {
      console.error('Error guardando en la nube:', e);
      return false;
    }
  };

  window.nubeLeer = async function() {
    try {
      const snap = await getDoc(refDatos);
      return snap.exists() ? snap.data() : null;
    } catch (e) {
      console.error('Error leyendo de la nube:', e);
      return null;
    }
  };

  window.nubeListo = true;
  window.dispatchEvent(new Event('nube-lista'));
</script>

<script>
// ============== ESTADO ==============
const SERVICIOS = {
  internet: { nombre: 'Internet', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.55a11 11 0 0 1 14.08 0"/><path d="M1.42 9a16 16 0 0 1 21.16 0"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>', color: '#06b6d4', gradient: 'linear-gradient(135deg, #06b6d4, #0891b2)' },

  spotify: { nombre: 'Spotify', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>', color: '#10b981', gradient: 'linear-gradient(135deg, #10b981, #059669)' },
  otros: { nombre: 'Otros', icon: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M16.5 9.4l-9-5.19M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><polyline points="3.27 6.96 12 12.01 20.73 6.96"/><line x1="12" y1="22.08" x2="12" y2="12"/></svg>', color: '#a78bfa', gradient: 'linear-gradient(135deg, #a78bfa, #8b5cf6)' }
};
const MESES_NOMBRES = ['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];

let state = {
  data: {
    internet: { precioReal: 0, clientes: [] },
    netflix: { precioReal: 0, clientes: [] },
    spotify: { precioReal: 0, clientes: [] },
    otros: { precioReal: 0, clientes: [] }
  },
  pagosMes: {},
  productos: [],
  ventas: [],
  config: { pinAdmin: '1234' },
  rol: null, // 'admin' | 'vendedor' | null (sin iniciar sesión)
  vista: 'inicio',
  mesActual: claveMes(new Date()),
  expandido: { internet: true, netflix: true, spotify: true, otros: true, perfumes: false },
  productoExpandido: {},
  ventasProductoExpandido: {},
  editandoPrecio: null,
  precioTemp: '',
  modal: null,
  formCliente: { nombre: '', pago: '', tipoPago: 'mensual', notas: '', diaPago: '' },
  modalProducto: null,
  formProducto: { nombre: '', precioCosto: '', precioVenta: '', stock: '', codigo: '', categoria: 'general',
    variantes: { '5ml': { precioVenta: '', codigo: '' }, '10ml': { precioVenta: '', codigo: '' } }
  },
  modalVenta: null,
  formVenta: { cantidad: '' },
  scanner: null
};

let videoStreamActivo = null;
let intervaloScanner = null;
let scannerPendiente = null; // productoId detectado en espera de confirmación de cobro

// ============== HELPERS ==============
function claveMes(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
function parseMes(k) { const [y,m] = k.split('-'); return { year: +y, month: +m-1 }; }
function formatoMes(k) { const {year, month} = parseMes(k); return `${MESES_NOMBRES[month]} ${year}`; }
function formatoMesCorto(k) { const {year, month} = parseMes(k); return `${MESES_NOMBRES[month]} ${String(year).slice(2)}`; }
function fmt(n) { return '$' + (n||0).toLocaleString('es-MX', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
function fmtCorto(n) { if (Math.abs(n) >= 1000) return '$' + (n/1000).toFixed(1) + 'k'; return '$' + Math.round(n); }
function estaPagado(sk, cid) { return state.pagosMes[state.mesActual]?.[sk+':'+cid] === true; }
function esc(s) { return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

// ============== PERSISTENCIA (localStorage) ==============
function guardarLocal() {
  try {
    localStorage.setItem('pagos-data', JSON.stringify(state.data));
    localStorage.setItem('pagos-mes', JSON.stringify(state.pagosMes));
    localStorage.setItem('tienda-productos', JSON.stringify(state.productos));
    localStorage.setItem('tienda-ventas', JSON.stringify(state.ventas));
    localStorage.setItem('app-config', JSON.stringify(state.config));
    localStorage.setItem('local-actualizado', String(Date.now()));
  } catch(e) { console.error(e); }

  // Sube a Firebase unos segundos después del último cambio (no en cada click,
  // para no mandar de más escrituras si estás marcando varios pagos seguidos).
  if (window.nubeListo) {
    clearTimeout(nubeTimeout);
    actualizarIndicadorNube('sincronizando');
    nubeTimeout = setTimeout(subirANube, 1500);
  }
}
function cargarLocal() {
  try {
    const d = localStorage.getItem('pagos-data');
    const p = localStorage.getItem('pagos-mes');
    const pr = localStorage.getItem('tienda-productos');
    const v = localStorage.getItem('tienda-ventas');
    const cfg = localStorage.getItem('app-config');
    if (d) state.data = { ...state.data, ...JSON.parse(d) };
    if (p) state.pagosMes = JSON.parse(p);
    if (pr) state.productos = JSON.parse(pr);
    if (v) state.ventas = JSON.parse(v);
    if (cfg) state.config = { ...state.config, ...JSON.parse(cfg) };
  } catch(e) { console.error(e); }
  // La sesión (rol) es propia de este dispositivo, no se sincroniza con la nube.
  try { state.rol = localStorage.getItem('sesion-rol') || null; } catch(e) {}
}

// ============== SINCRONIZACIÓN CON LA NUBE (FIREBASE) ==============
let nubeTimeout = null;

function actualizarIndicadorNube(estado) {
  const el = document.getElementById('nube-status');
  if (!el) return;
  const mapa = {
    sincronizando: { icono: '🔄', titulo: 'Sincronizando…' },
    ok: { icono: '☁️', titulo: 'Sincronizado con la nube' },
    error: { icono: '⚠️', titulo: 'Sin conexión — solo guardado en el teléfono' }
  };
  const m = mapa[estado] || mapa.error;
  el.textContent = m.icono;
  el.title = m.titulo;
}

async function subirANube() {
  if (!window.nubeListo) return;
  const ok = await window.nubeGuardar({
    data: state.data,
    pagosMes: state.pagosMes,
    productos: state.productos,
    ventas: state.ventas,
    config: state.config
  });
  actualizarIndicadorNube(ok ? 'ok' : 'error');
}

async function sincronizarNube() {
  if (!window.nubeListo) return;
  actualizarIndicadorNube('sincronizando');
  const remoto = await window.nubeLeer();
  const remotoTs = remoto?.actualizado || 0;
  const localTs = parseInt(localStorage.getItem('local-actualizado') || '0');

  if (remoto && remotoTs > localTs) {
    // La nube tiene algo más nuevo que este teléfono (p. ej. se perdieron los
    // datos locales, o los editaste desde otro dispositivo). Traemos la nube.
    state.data = remoto.data || state.data;
    state.pagosMes = remoto.pagosMes || state.pagosMes;
    state.productos = remoto.productos || state.productos;
    state.ventas = remoto.ventas || state.ventas;
    state.config = remoto.config || state.config;
    try {
      localStorage.setItem('pagos-data', JSON.stringify(state.data));
      localStorage.setItem('pagos-mes', JSON.stringify(state.pagosMes));
      localStorage.setItem('tienda-productos', JSON.stringify(state.productos));
      localStorage.setItem('tienda-ventas', JSON.stringify(state.ventas));
      localStorage.setItem('app-config', JSON.stringify(state.config));
      localStorage.setItem('local-actualizado', String(remotoTs));
    } catch(e) {}
    actualizarIndicadorNube('ok');
    render();
  } else {
    // Este teléfono está igual o más al día: subimos para que la nube quede sincronizada.
    subirANube();
  }
}

// ============== TIENDA (productos por pieza) ==============
function variantesFormVacias() {
  return { '5ml': { precioVenta: '' }, '10ml': { precioVenta: '' } };
}

// Un frasco de perfume se asume de 100ml. Estas funciones llevan la cuenta de
// cuánto se ha vendido (en ml y en dinero) desde que empezó el frasco actual
// (p.cicloInicio), para saber cuándo ya se recuperó el costo y cuándo el
// frasco se terminó (100ml vendidos) para reiniciar el conteo con el siguiente.
function mlDeTamano(tamano) { return parseInt(tamano) || 0; } // '5ml' -> 5, '10ml' -> 10

function calcularCicloPerfume(p) {
  const desde = p.cicloInicio || p.creado || 0;
  const ventasCiclo = state.ventas.filter(v => v.productoId === p.id && v.fecha >= desde);
  const mlVendidos = ventasCiclo.reduce((s, v) => s + mlDeTamano(v.tamano) * v.cantidad, 0);
  const ingresoAcumulado = ventasCiclo.reduce((s, v) => s + v.total, 0);
  return { mlVendidos, ingresoAcumulado };
}

// Calcula el total a cobrar y la ganancia real de una venta de perfume,
// tomando en cuenta cuánto del costo del frasco ya se había recuperado antes
// de esta venta (lo que falte por recuperar no cuenta como ganancia).
function calcularVentaPerfume(p, tamano, cantidad) {
  const v = (p.variantes || []).find(vv => vv.tamano === tamano);
  if (!v) return null;
  const total = Math.round(v.precioVenta * cantidad * 100) / 100;
  const { ingresoAcumulado } = calcularCicloPerfume(p);
  const costoRestante = Math.max(0, (p.precioCosto || 0) - ingresoAcumulado);
  const ganancia = Math.round(Math.max(0, total - costoRestante) * 100) / 100;
  return { precioVenta: v.precioVenta, total, ganancia };
}

// Después de registrar una venta de perfume, si ya se llegó a 100ml vendidos
// en este ciclo, se reinicia: empieza a contarse un frasco nuevo desde cero.
function actualizarCicloPerfume(p, ventaFecha) {
  const { mlVendidos } = calcularCicloPerfume(p);
  if (mlVendidos >= 100) {
    p.cicloInicio = ventaFecha + 1;
  }
}

function obtenerInfoVenta(p, tamano) {
  if (tamano) {
    const v = (p.variantes || []).find(vv => vv.tamano === tamano);
    return v ? { precioVenta: v.precioVenta, stock: null } : null; // stock null = sin límite (perfumes)
  }
  return { precioCosto: p.precioCosto, precioVenta: p.precioVenta, stock: p.stock };
}

function actualizarFormVenta(valor) {
  state.formVenta.cantidad = valor;
  const p = state.productos.find(pp => pp.id === state.modalVenta.productoId);
  if (!p) return;
  const tamano = state.modalVenta.tamano;
  const info = obtenerInfoVenta(p, tamano);
  if (!info) return;
  const sinLimite = info.stock === null;
  const cant = parseInt(valor) || 0;
  let totalEstim, gananciaEstim;
  if (tamano) {
    const calc = calcularVentaPerfume(p, tamano, cant || 0);
    totalEstim = calc ? calc.total : 0;
    gananciaEstim = calc ? calc.ganancia : 0;
  } else {
    totalEstim = info.precioVenta * cant;
    gananciaEstim = (info.precioVenta - info.precioCosto) * cant;
  }
  const totalEl = document.getElementById('venta-total');
  const gananciaEl = document.getElementById('venta-ganancia');
  const btn = document.getElementById('btn-confirmar-venta');
  if (totalEl) totalEl.textContent = fmt(totalEstim);
  if (gananciaEl) gananciaEl.textContent = fmt(gananciaEstim);
  if (btn) btn.disabled = cant < 1 || (!sinLimite && cant > info.stock);
}
function registrarVenta(productoId, tamano) {
  const p = state.productos.find(pp => pp.id === productoId);
  if (!p) return;
  const info = obtenerInfoVenta(p, tamano);
  if (!info) return;
  const sinLimite = info.stock === null;
  const cant = parseInt(state.formVenta.cantidad) || 0;
  if (cant < 1 || (!sinLimite && cant > info.stock)) return;

  let total, ganancia;
  if (tamano) {
    const calc = calcularVentaPerfume(p, tamano, cant);
    if (!calc) return;
    total = calc.total;
    ganancia = calc.ganancia;
  } else {
    total = Math.round(info.precioVenta * cant * 100) / 100;
    ganancia = Math.round((info.precioVenta - info.precioCosto) * cant * 100) / 100;
  }
  const venta = {
    id: 'v_'+Date.now()+'_'+Math.random().toString(36).slice(2,8),
    productoId,
    tamano: tamano || null,
    cantidad: cant,
    total,
    ganancia,
    fecha: Date.now(),
    mes: claveMes(new Date())
  };
  state.ventas.push(venta);
  // sinLimite es true siempre que haya "tamano" (perfumes ya no llevan stock),
  // así que aquí solo se descuenta stock de productos generales.
  if (!sinLimite) p.stock -= cant;
  if (tamano) actualizarCicloPerfume(p, venta.fecha);
  guardarLocal();
  cerrarModalVenta();
  render();
}

function calcularTotalesTienda() {
  const mesActual = claveMes(new Date());
  let ganancia = 0, vendido = 0, piezas = 0;
  state.ventas.forEach(v => {
    if (v.mes === mesActual) {
      ganancia += v.ganancia;
      vendido += v.total;
      piezas += v.cantidad;
    }
  });
  return { ganancia: Math.round(ganancia*100)/100, vendido: Math.round(vendido*100)/100, piezas };
}

// ============== ESCÁNER DE CÓDIGO DE BARRAS ==============
function abrirScannerVenta() {
  scannerPendiente = null;
  state.scanner = { modo: 'venta' };
  render();
  iniciarCamara();
}
function abrirScannerAsignar() {

  state.scanner = { modo: 'asignar' };

  iniciarCamara();
}
function cerrarScanner() {
  detenerCamara();
  scannerPendiente = null;
  state.scanner = null;
  render();
}

async function iniciarCamara() {
  const statusEl = document.getElementById('scanner-status');
  const videoWrap = document.querySelector('.scanner-video-wrap');
  if (!('BarcodeDetector' in window)) {
    if (statusEl) { statusEl.textContent = 'Tu navegador no soporta escaneo automático. Escribe el código abajo.'; statusEl.style.color = '#fbbf24'; }
    if (videoWrap) videoWrap.style.display = 'none';
    return;
  }
  try {
    videoStreamActivo = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    const video = document.getElementById('scanner-video');
    if (!video) { detenerCamara(); return; }
    video.srcObject = videoStreamActivo;
    await video.play();
    const detector = new BarcodeDetector({ formats: ['ean_13','ean_8','upc_a','upc_e','code_128','code_39','qr_code'] });
    let ultimoCodigo = null, ultimoTiempo = 0;
    intervaloScanner = setInterval(async () => {
      if (!video.videoWidth) return;
      if (scannerPendiente) return; // pausado: hay una venta esperando confirmación
      try {
        const codigos = await detector.detect(video);
        if (codigos.length > 0) {
          const valor = codigos[0].rawValue;
          const ahora = Date.now();
          if (valor === ultimoCodigo && ahora - ultimoTiempo < 2500) return;
          ultimoCodigo = valor; ultimoTiempo = ahora;
          procesarCodigoDetectado(valor);
        }
      } catch(err) {}
    }, 400);
  } catch(err) {
    if (statusEl) { statusEl.textContent = 'No se pudo acceder a la cámara. Revisa permisos o escribe el código abajo.'; statusEl.style.color = '#ef4444'; }
    if (videoWrap) videoWrap.style.display = 'none';
  }
}

function detenerCamara() {
  if (intervaloScanner) { clearInterval(intervaloScanner); intervaloScanner = null; }
  if (videoStreamActivo) { videoStreamActivo.getTracks().forEach(t => t.stop()); videoStreamActivo = null; }
}

function buscarCodigoManual() {
  const input = document.getElementById('scanner-manual-input');
  if (!input || !input.value.trim()) return;
  procesarCodigoDetectado(input.value.trim());
  input.value = '';
}

function buscarProductoPorCodigo(codigo) {
  return state.productos.find(p => p.codigo && p.codigo === codigo) || null;
}

function procesarCodigoDetectado(codigo) {
  if (!state.scanner) return;

  if (state.scanner.modo === 'asignar') {
    state.formProducto.codigo = codigo;
    cerrarScanner();
    return;
  }

  if (scannerPendiente) {
    const statusEl = document.getElementById('scanner-status');
    if (statusEl) { statusEl.textContent = '⚠️ Termina de cobrar el producto actual primero'; statusEl.style.color = '#fbbf24'; }
    return; // ya hay una venta esperando confirmación
  }

  const statusEl = document.getElementById('scanner-status');
  const p = buscarProductoPorCodigo(codigo);

  if (!p) {
    if (statusEl) { statusEl.textContent = `⚠️ Código "${codigo}" no está asignado a ningún producto`; statusEl.style.color = '#ef4444'; }
    return;
  }

  const esPerfumeConVariantes = p.categoria === 'perfumes' && Array.isArray(p.variantes) && p.variantes.length > 0;
  const confirmarEl = document.getElementById('scanner-confirmar');

  if (esPerfumeConVariantes) {
    // Un solo código para el perfume: pedimos que elija la presentación,
    // mostrando de una vez el precio de cada una.
    scannerPendiente = { productoId: p.id, eligiendoTamano: true };
    if (statusEl) { statusEl.textContent = '¿5ml o 10ml?'; statusEl.style.color = '#06b6d4'; }
    if (confirmarEl) {
      confirmarEl.style.display = 'block';
      confirmarEl.innerHTML = `
        <div class="cliente card" style="border: 1px solid rgba(168,85,247,0.4); flex-direction:column; align-items:stretch; gap:10px">
          <div class="cliente-info">
            <div class="nombre">🌸 ${esc(p.nombre)}</div>
            <div class="cliente-notas">¿Qué presentación vendiste?</div>
          </div>
          <div style="display:flex; gap:8px">
            ${p.variantes.map(v => `
              <button class="guardar-btn" style="flex:1; margin-top:0; background:#a855f7" onclick="elegirTamanoScanner('${v.tamano}')">
                ${esc(v.tamano)}<br>${fmt(v.precioVenta)}
              </button>
            `).join('')}
          </div>
          <button class="tipo-btn" onclick="cancelarVentaScanner()">Cancelar</button>
        </div>
      `;
    }
    return;
  }

  // Producto general (o un perfume viejo sin variantes): flujo normal de confirmar y cobrar
  const precioVenta = p.precioVenta;
  const nombreMostrado = p.nombre;

  if (!(p.stock > 0)) {
    if (statusEl) { statusEl.textContent = `⚠️ ${nombreMostrado} no tiene piezas en stock`; statusEl.style.color = '#ef4444'; }
    return;
  }

  scannerPendiente = { productoId: p.id, tamano: null };
  if (statusEl) { statusEl.textContent = 'Producto detectado — confirma para cobrar'; statusEl.style.color = '#06b6d4'; }

  if (confirmarEl) {
    confirmarEl.style.display = 'block';
    confirmarEl.innerHTML = `
      <div class="cliente card" style="border: 1px solid rgba(16,185,129,0.4); flex-direction:column; align-items:stretch; gap:10px">
        <div style="display:flex; justify-content:space-between; align-items:center">
          <div class="cliente-info">
            <div class="nombre">${esc(nombreMostrado)}</div>
            <div class="cliente-notas">Stock disponible: ${p.stock}</div>
          </div>

function confirmarVentaScanner() {
  if (!scannerPendiente) return;

  const p = state.productos.find(pp => pp.id === productoId);

    ganancia: Math.round((p.precioVenta - p.precioCosto) * 100) / 100,

  };

// ============== CÁLCULOS ==============
function calcularTotalesMes() {
  let cobrado = 0, costoReal = 0, mensual = 0;
  Object.entries(state.data).forEach(([sk, s]) => {
    let huboPagos = false;
    s.clientes.forEach(c => {
      if (c.tipoPago === 'mensual') mensual += c.pago;
      if (estaPagado(sk, c.id)) { cobrado += c.pago; huboPagos = true; }
    });
    if (huboPagos) costoReal += s.precioReal;
  });
  return { cobrado, costoReal, ganancia: cobrado - costoReal, mensualEsperado: mensual };
}

function calcularDatosMensuales() {
  const hoy = new Date();
  const meses = [];
  for (let i = 11; i >= 0; i--) {
    const d = new Date(hoy.getFullYear(), hoy.getMonth() - i, 1);
    const key = claveMes(d);
    const pagos = state.pagosMes[key] || {};
    let cobrado = 0, costo = 0;
    Object.entries(state.data).forEach(([sk, s]) => {
      let hubo = false;
      s.clientes.forEach(c => {
        if (pagos[sk+':'+c.id]) { cobrado += c.pago; hubo = true; }
      });
      if (hubo) costo += s.precioReal;
    });
    meses.push({
      mes: formatoMesCorto(key),
      cobrado: Math.round(cobrado*100)/100,
      costo: Math.round(costo*100)/100,
      ganancia: Math.round((cobrado-costo)*100)/100
    });
  }
  return meses;
}

// Ventas de la tienda (productos + perfumes) día por día, del mes en curso.
// Se incluyen TODOS los días del mes (aunque no hayan tenido ventas) para
// que el rango de fechas en la gráfica se vea correcto.
function calcularVentasPorDia() {
  const hoy = new Date();
  const anio = hoy.getFullYear(), mes = hoy.getMonth();
  const ultimoDia = new Date(anio, mes + 1, 0).getDate();
  const mesK = claveMes(hoy);
  const porDia = {};
  for (let d = 1; d <= ultimoDia; d++) {
    const key = `${anio}-${String(mes+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    porDia[key] = { fecha: key, piezas: 0, vendido: 0, ganancia: 0 };
  }
  state.ventas.forEach(v => {
    if (v.mes !== mesK) return;
    const dt = new Date(v.fecha);
    const key = `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,'0')}-${String(dt.getDate()).padStart(2,'0')}`;
    if (porDia[key]) {
      porDia[key].piezas += v.cantidad;
      porDia[key].vendido += v.total;
      porDia[key].ganancia += v.ganancia;
    }
  });
  return Object.values(porDia);
}
function formatearFechaCorta(fechaKey) {
  const [y, m, d] = fechaKey.split('-').map(Number);
  return new Date(y, m - 1, d).toLocaleDateString('es-MX', { day: '2-digit', month: 'short' });
}

// ============== RESPALDO (exportar / importar) ==============
function verRespaldoTexto() {
  const respaldo = { data: state.data, pagosMes: state.pagosMes, productos: state.productos, ventas: state.ventas, version: 2, fecha: new Date().toISOString() };
  const contenido = JSON.stringify(respaldo);
  const overlay = document.createElement('div');
  overlay.className = 'modal-overlay';
  overlay.innerHTML = `
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>Respaldo en texto</h3>
        <button class="close-btn" onclick="this.closest('.modal-overlay').remove()">✕</button>
      </div>
      <div class="modal-subtitle" style="color:#94a3b8">Copia este texto y guárdalo en Notas o mándatelo por WhatsApp. Para restaurar, pégalo tal cual en el mismo lugar.</div>
      <textarea class="input" readonly rows="8" style="font-family:'JetBrains Mono',monospace; font-size:11px; resize:vertical" id="respaldo-texto-area">${esc(contenido)}</textarea>
      <button class="guardar-btn" style="margin-top:10px" id="btn-copiar-respaldo">📋 Copiar al portapapeles</button>
    </div>
  `;
  overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
  document.body.appendChild(overlay);
  const ta = overlay.querySelector('#respaldo-texto-area');
  overlay.querySelector('#btn-copiar-respaldo').addEventListener('click', () => {
    ta.removeAttribute('readonly');
    ta.select();
    ta.setSelectionRange(0, 999999);
    let copiado = false;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(contenido);
        copiado = true;
      }
    } catch(e) {}
    if (!copiado) {
      try { copiado = document.execCommand('copy'); } catch(e) {}
    }
    ta.setAttribute('readonly', 'true');
    if (copiado) { registrarRespaldoHecho(); render(); }
    alert(copiado ? 'Copiado ✅ Ya lo puedes pegar donde quieras.' : 'No se pudo copiar solo. El texto ya está seleccionado, mantén presionado y elige "Copiar".');
  });
}

async function exportarRespaldo() {
  const respaldo = { data: state.data, pagosMes: state.pagosMes, productos: state.productos, ventas: state.ventas, version: 2, fecha: new Date().toISOString() };
  const contenido = JSON.stringify(respaldo, null, 2);
  const f = new Date();
  const nombre = `jd-ventas-respaldo-${f.getFullYear()}-${String(f.getMonth()+1).padStart(2,'0')}-${String(f.getDate()).padStart(2,'0')}.json`;

  // Intento 1: compartir el archivo con el menú nativo de Android (más confiable en navegadores móviles)
  try {
    if (navigator.canShare && navigator.share) {
      const file = new File([contenido], nombre, { type: 'application/json' });
      if (navigator.canShare({ files: [file] })) {
        await navigator.share({ files: [file], title: 'Respaldo J.D Ventas' });
        registrarRespaldoHecho();
        render();
        return;
      }
    }
  } catch(err) {
    // si el usuario cancela el share, o falla, seguimos con el siguiente intento
  }

  // Intento 2: descarga clásica con blob
  try {
    const blob = new Blob([contenido], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1500);
    registrarRespaldoHecho();
    render();
  } catch(err) {
    // Intento 3: abrir en pestaña nueva para que el usuario lo guarde manualmente
    try {
      const blob = new Blob([contenido], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      window.open(url, '_blank');
      registrarRespaldoHecho();
      render();
    } catch(err2) {
      alert('No se pudo generar el respaldo. Intenta con Chrome.');
    }
  }
}
function importarRespaldo(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    try {
      const json = JSON.parse(e.target.result);
      if (!json.data || !json.pagosMes) throw new Error('Formato inválido');
      if (!confirm('Esto reemplazará todos los datos actuales con los del respaldo. ¿Continuar?')) return;
      state.data = json.data;
      state.pagosMes = json.pagosMes;
      state.productos = json.productos || [];
      state.ventas = json.ventas || [];
      guardarLocal();
      render();
      alert('Respaldo restaurado correctamente.');
    } catch(err) {
      alert('El archivo no es un respaldo válido de J.D Ventas.');
    }
  };
  reader.readAsText(file);
  input.value = '';
}

// ============== VENCIMIENTOS ==============
function calcularVencimientos() {
  const LIMITE_DIAS = 5; // avisar desde 5 días antes
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  const claveReal = claveMes(hoy);
  const pagosReales = state.pagosMes[claveReal] || {};
  const lista = [];
  Object.entries(state.data).forEach(([sk, s]) => {
    s.clientes.forEach(c => {
      if (c.tipoPago !== 'mensual' || (!c.diaPago && !c.ultimoPago)) return;
      if (pagosReales[sk+':'+c.id]) return; // ya pagó este mes
      const info = calcularEstadoVencimiento(c);
      if (!info) return;
      if (info.diff <= LIMITE_DIAS) {
        lista.push({ servicio: sk, cliente: c, diasRestantes: info.diff });
      }
    });
  });
  lista.sort((a,b) => a.diasRestantes - b.diasRestantes);
  return lista;
}

async function intentarLogin(rol) {
  if (rol === 'vendedor') {
    state.rol = 'vendedor';
    try { localStorage.setItem('sesion-rol', 'vendedor'); } catch(e) {}
    state.vista = 'cobros';
    render();
    return;
  }

  // Admin sí requiere PIN
  const pin = prompt('Ingresa el PIN de Admin:');
  if (pin === null) return;

  // Verificamos contra el PIN más reciente de la nube (si hay internet), no solo
  // el que esté en memoria en este momento — importante la primera vez que se
  // abre la app en un teléfono nuevo, antes de que termine de sincronizar.
  let pinVigente = state.config.pinAdmin;
  if (window.nubeListo) {
    try {
      const remoto = await window.nubeLeer();
      if (remoto?.config?.pinAdmin) pinVigente = remoto.config.pinAdmin;
    } catch(e) { /* sin internet: seguimos con el PIN que ya teníamos guardado */ }
  }

  if (pin.trim() === pinVigente) {
    state.rol = 'admin';
    try { localStorage.setItem('sesion-rol', 'admin'); } catch(e) {}
    state.vista = 'inicio';
    render();
  } else {
    alert('PIN incorrecto.');
  }
}
function cerrarSesion() {
  state.rol = null;
  try { localStorage.removeItem('sesion-rol'); } catch(e) {}
  render();
}
function cambiarPinAdmin() {
  const nuevo = prompt('Nuevo PIN de Admin (solo números):', state.config.pinAdmin);
  if (nuevo === null || !nuevo.trim()) return;
  state.config.pinAdmin = nuevo.trim();
  guardarLocal();
  render();
  alert('✅ PIN actualizado.');
}

const DIAS_AVISO_RESPALDO = 7;

function registrarRespaldoHecho() {
  try { localStorage.setItem('ultimo-respaldo', String(Date.now())); } catch(e) {}
}
function diasDesdeUltimoRespaldo() {
  try {
    const raw = localStorage.getItem('ultimo-respaldo');
    if (!raw) return null;
    return Math.floor((Date.now() - parseInt(raw)) / 86400000);
  } catch(e) { return null; }
}
function renderAvisoRespaldo() {
  const dias = diasDesdeUltimoRespaldo();

    app.innerHTML = renderLogin();
    bindEvents();
    return;
  }

  if (state.rol === 'vendedor') {
    if (state.vista !== 'cobros' && state.vista !== 'tienda') state.vista = 'cobros';
    const vista = state.vista === 'tienda' ? renderTienda() : renderCobros();
    app.innerHTML = renderHeader() + vista + renderNavRecepcion() + renderModal() + renderModalVenta() + renderModalScanner();

  // Admin: control total

}

// ============== NOTIFICACIONES DE VENCIMIENTO ==============
const LIMITE_NOTIFICACION = 3; // avisar desde 3 días antes de vencer (y si ya venció)

function cargarNotificados() {
  try {
    const raw = localStorage.getItem('notificados-hoy');
    if (!raw) return { fecha: claveHoyISO(), ids: [] };
    const obj = JSON.parse(raw);
    if (obj.fecha !== claveHoyISO()) return { fecha: claveHoyISO(), ids: [] };
    return obj;
  } catch(e) { return { fecha: claveHoyISO(), ids: [] }; }
}
function guardarNotificados(obj) {
  try { localStorage.setItem('notificados-hoy', JSON.stringify(obj)); } catch(e) {}
}

function dispararNotificacion(titulo, cuerpo) {
  if (navigator.serviceWorker && navigator.serviceWorker.ready) {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification(titulo, { body: cuerpo, icon: 'icon-192.png', badge: 'icon-192.png', tag: titulo });
    }).catch(() => {
      try { new Notification(titulo, { body: cuerpo }); } catch(e) {}
    });
  } else {
    try { new Notification(titulo, { body: cuerpo }); } catch(e) {}
  }
}

function revisarYNotificar() {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  const venc = calcularVencimientos();
  const notif = cargarNotificados();
  let huboNuevas = false;
  venc.forEach(v => {
    if (v.diasRestantes > LIMITE_NOTIFICACION) return;
    const clave = v.servicio + ':' + v.cliente.id;
    if (notif.ids.includes(clave)) return;
    const info = SERVICIOS[v.servicio];
    const texto = v.diasRestantes < 0
      ? `Vencido hace ${Math.abs(v.diasRestantes)} día(s) — ${info.nombre}`
      : v.diasRestantes === 0
        ? `Vence hoy — ${info.nombre}`
        : `Vence en ${v.diasRestantes} día(s) — ${info.nombre}`;
    dispararNotificacion(`${v.cliente.nombre}`, texto);
    notif.ids.push(clave);
    huboNuevas = true;
  });
  if (huboNuevas) guardarNotificados(notif);
}

async function activarNotificaciones() {
  if (!('Notification' in window)) {
    alert('Este navegador no soporta notificaciones.');
    return;
  }
  const permiso = await Notification.requestPermission();
  if (permiso === 'granted') {
    revisarYNotificar();
    render();
  } else {
    alert('No se activaron las notificaciones. Puedes intentarlo de nuevo cuando quieras desde este mismo botón.');
  }
}

function claveHoyISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

function sumarMes(fecha) {
  const dia = fecha.getDate();
  const destino = new Date(fecha.getFullYear(), fecha.getMonth()+1, 1);
  const diasEnDestino = new Date(destino.getFullYear(), destino.getMonth()+1, 0).getDate();
  destino.setDate(Math.min(dia, diasEnDestino));
  return destino;
}

// Calcula cuándo vence la membresía de un cliente. Si tiene fecha real del último
// pago (ultimoPago), la usa (vence 1 mes después, con precisión de día exacto).
// Si no, usa el día fijo de vencimiento (diaPago) sobre el mes actual.
function calcularEstadoVencimiento(c) {
  const hoy = new Date();
  hoy.setHours(0,0,0,0);
  let fechaVenc;
  if (c.ultimoPago) {
    fechaVenc = sumarMes(new Date(c.ultimoPago + 'T00:00:00'));
  } else if (c.diaPago) {
    const diasEnMes = new Date(hoy.getFullYear(), hoy.getMonth()+1, 0).getDate();
    const dia = Math.min(c.diaPago, diasEnMes);
    fechaVenc = new Date(hoy.getFullYear(), hoy.getMonth(), dia);
  } else {
    return null;
  }
  const diff = Math.round((fechaVenc - hoy) / 86400000);
  if (diff < 0) return { diff, color: '#ef4444', texto: `Vencido ${Math.abs(diff)}d` };
  if (diff === 0) return { diff, color: '#fbbf24', texto: 'Vence hoy' };
  if (diff <= 5) return { diff, color: '#fbbf24', texto: `En ${diff}d` };
  return { diff, color: '#64748b', texto: `En ${diff}d` };
}

function renderLineChart(datos) {
  const W = 320, H = 200, padL = 40, padR = 10, padT = 10, padB = 30;
  const cw = W - padL - padR, ch = H - padT - padB;
  const valores = datos.map(d => d.ganancia);
  let minV = Math.min(...valores, 0);
  let maxV = Math.max(...valores, 0);
  if (minV === maxV) { maxV = minV + 100; }
  const rango = maxV - minV;
  const xStep = cw / (datos.length - 1 || 1);

  const px = i => padL + i * xStep;
  const py = v => padT + ch - ((v - minV) / rango) * ch;

  // Líneas grid
  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (ch / 4) * i;
    const val = maxV - (rango / 4) * i;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>`;
    grid += `<text x="${padL-4}" y="${y+3}" fill="#64748b" font-size="9" text-anchor="end" font-family="JetBrains Mono">${fmtCorto(val)}</text>`;
  }

  // Línea cero
  if (minV < 0 && maxV > 0) {
    const y0 = py(0);
    grid += `<line x1="${padL}" y1="${y0}" x2="${W-padR}" y2="${y0}" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>`;
  }

  // Path
  const pathD = datos.map((d, i) => `${i === 0 ? 'M' : 'L'} ${px(i)} ${py(d.ganancia)}`).join(' ');

  // Área debajo
  const areaD = pathD + ` L ${px(datos.length-1)} ${padT+ch} L ${px(0)} ${padT+ch} Z`;

  // Puntos y labels X
  let puntos = '', labelsX = '';
  datos.forEach((d, i) => {
    puntos += `<circle cx="${px(i)}" cy="${py(d.ganancia)}" r="3.5" fill="#10b981" stroke="#0a0e1a" stroke-width="2"/>`;
    if (i % 2 === 0 || i === datos.length - 1) {
      labelsX += `<text x="${px(i)}" y="${H-12}" fill="#64748b" font-size="9" text-anchor="middle">${d.mes}</text>`;
    }
  });

  return `<div class="chart-container">
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      <defs>
        <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
          <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
        </linearGradient>
      </defs>
      ${grid}
      <path d="${areaD}" fill="url(#areaGrad)"/>
      <path d="${pathD}" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
      ${puntos}
      ${labelsX}
    </svg>
  </div>`;
}

function renderBarChart(datos) {
  const W = 320, H = 200, padL = 40, padR = 10, padT = 10, padB = 30;
  const cw = W - padL - padR, ch = H - padT - padB;
  const maxV = Math.max(...datos.flatMap(d => [d.cobrado, d.costo]), 1);
  const groupW = cw / datos.length;
  const barW = groupW * 0.35;
  const gap = groupW * 0.05;

  let grid = '';
  for (let i = 0; i <= 4; i++) {
    const y = padT + (ch / 4) * i;
    const val = maxV - (maxV / 4) * i;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>`;
    grid += `<text x="${padL-4}" y="${y+3}" fill="#64748b" font-size="9" text-anchor="end" font-family="JetBrains Mono">${fmtCorto(val)}</text>`;
  }

  let bars = '', labelsX = '';
  datos.forEach((d, i) => {
    const gx = padL + i * groupW + groupW * 0.1;
    const hCob = (d.cobrado / maxV) * ch;
    const hCos = (d.costo / maxV) * ch;
    bars += `<rect x="${gx}" y="${padT+ch-hCob}" width="${barW}" height="${hCob}" fill="#06b6d4" rx="3"/>`;
    bars += `<rect x="${gx+barW+gap}" y="${padT+ch-hCos}" width="${barW}" height="${hCos}" fill="#64748b" rx="3"/>`;
    labelsX += `<text x="${padL + i*groupW + groupW/2}" y="${H-12}" fill="#64748b" font-size="9" text-anchor="middle">${d.mes}</text>`;
  });

  return `<div class="chart-container">
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${grid}
      ${bars}
      ${labelsX}
    </svg>
    <div style="display:flex; gap:16px; justify-content:center; margin-top:8px; font-size:11px">
      <span style="display:flex; align-items:center; gap:4px"><span style="width:10px; height:10px; background:#06b6d4; border-radius:2px; display:inline-block"></span> Cobrado</span>
      <span style="display:flex; align-items:center; gap:4px"><span style="width:10px; height:10px; background:#64748b; border-radius:2px; display:inline-block"></span> Costo</span>
    </div>
  </div>`;
}

// Gráfica de piezas vendidas por día (mes en curso). El día con más piezas
// se resalta en un color distinto para identificarlo de un vistazo.
function renderBarChartDias(datos) {
  const W = 320, H = 170, padL = 26, padR = 8, padT = 10, padB = 20;
  const cw = W - padL - padR, ch = H - padT - padB;
  const maxV = Math.max(...datos.map(d => d.piezas), 1);
  const groupW = cw / datos.length;
  const barW = Math.max(2, groupW * 0.55);
  const maxPiezas = maxV;

  let grid = '';
  for (let i = 0; i <= 3; i++) {
    const y = padT + (ch / 3) * i;
    const val = maxV - (maxV / 3) * i;
    grid += `<line x1="${padL}" y1="${y}" x2="${W-padR}" y2="${y}" stroke="rgba(255,255,255,0.05)" stroke-dasharray="3 3"/>`;
    grid += `<text x="${padL-4}" y="${y+3}" fill="#64748b" font-size="8" text-anchor="end" font-family="JetBrains Mono">${Math.round(val)}</text>`;
  }

  let bars = '', labelsX = '';
  datos.forEach((d, i) => {
    const gx = padL + i * groupW + (groupW - barW) / 2;
    const h = (d.piezas / maxV) * ch;
    const diaNum = Number(d.fecha.split('-')[2]);
    const esMejor = d.piezas > 0 && d.piezas === maxPiezas;
    bars += `<rect x="${gx}" y="${padT+ch-h}" width="${barW}" height="${Math.max(h,0)}" fill="${esMejor ? '#f59e0b' : '#f59e0b60'}" rx="2"/>`;
    if (diaNum === 1 || diaNum % 5 === 0 || i === datos.length - 1) {
      labelsX += `<text x="${padL + i*groupW + groupW/2}" y="${H-8}" fill="#64748b" font-size="8" text-anchor="middle">${diaNum}</text>`;
    }
  });

  return `<div class="chart-container">
    <svg class="chart-svg" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">
      ${grid}
      ${bars}
      ${labelsX}
    </svg>
  </div>`;
}

function renderNav() {
  return `<div class="nav-bottom">
    <button class="nav-btn ${state.vista === 'inicio' ? 'activo' : ''}" data-action="setVista" data-vista="inicio">
      <span class="icon">🏠</span> Inicio
    </button>
    <button class="nav-btn ${state.vista === 'tienda' ? 'activo' : ''}" data-action="setVista" data-vista="tienda">
      <span class="icon">🛒</span> Productos
    </button>
    <button class="nav-btn ${state.vista === 'dashboard' ? 'activo' : ''}" data-action="setVista" data-vista="dashboard">
      <span class="icon">📊</span> Dashboard
    </button>
  </div>`;
}

function renderModal() {
  if (!state.modal) return '';
  const info = SERVICIOS[state.modal.servicio];
  const f = state.formCliente;
  return `<div class="modal-overlay" data-action="cerrarModal">
    <div class="modal" onclick="event.stopPropagation()">
      <div class="modal-header">
        <h3>${state.modal.clienteId ? 'Editar' : 'Nuevo'} cliente</h3>
        <button class="close-btn" data-action="cerrarModal">✕</button>
      </div>
      <div class="modal-subtitle" style="color:${info.color}">${info.nombre}</div>

      <div class="campo">
        <div class="campo-label"><label>Nombre del cliente <span class="required">*</span></label></div>
        <input class="input" type="text" value="${esc(f.nombre)}" placeholder="Ej. Juan Pérez" oninput="actualizarForm('nombre', this.value); document.getElementById('btn-guardar').disabled = !this.value.trim()" />
      </div>

      <div class="campo">
        <div class="campo-label"><label>¿Cuánto paga? ($)</label><span class="hint">Lo que te paga</span></div>
        <input class="input" type="number" inputmode="decimal" value="${esc(f.pago)}" placeholder="0.00" oninput="actualizarForm('pago', this.value)" />
      </div>

      <div class="campo">
        <div class="campo-label"><label>Tipo de pago</label></div>
        <div class="tipo-pago-grid">
          <button class="tipo-btn ${f.tipoPago === 'mensual' ? 'activo' : ''}" data-action="setTipoPago" data-tipo="mensual">Mensual</button>
          <button class="tipo-btn ${f.tipoPago === 'unico' ? 'activo' : ''}" data-action="setTipoPago" data-tipo="unico">Pago único</button>
        </div>
      </div>

      <div class="campo">
        <div class="campo-label"><label>Día de vencimiento (opcional)</label><span class="hint">Día del mes, 1-31</span></div>
        <input class="input" type="number" inputmode="numeric" min="1" max="31" value="${esc(f.diaPago)}" placeholder="Ej. 15" oninput="actualizarForm('diaPago', this.value)" />
      </div>

      <div class="campo">
        <div class="campo-label"><label>Fecha del último pago (opcional)</label><span class="hint">Se llena sola al marcar pagado</span></div>
        <input class="input" type="date" value="${esc(f.ultimoPago)}" oninput="actualizarForm('ultimoPago', this.value)" />
      </div>

      <div class="campo">
        <div class="campo-label"><label>Notas (opcional)</label></div>
        <textarea class="input" rows="2" style="resize:vertical; min-height:60px" placeholder="Detalles adicionales" oninput="actualizarForm('notas', this.value)">${esc(f.notas)}</textarea>
      </div>

      <button id="btn-guardar" class="guardar-btn" ${!f.nombre.trim() ? 'disabled' : ''} data-action="guardarCliente">
        ✓ ${state.modal.clienteId ? 'Guardar cambios' : 'Agregar cliente'}
      </button>
    </div>
  </div>`;
}

// ============== EVENTOS ==============
function bindEvents() {
  document.querySelectorAll('[data-action]').forEach(el => {
    el.addEventListener('click', handleClick);
  });
  const pi = document.getElementById('precio-input');
  if (pi) {
    pi.addEventListener('input', e => { state.precioTemp = e.target.value; });
    pi.addEventListener('keydown', e => {
      if (e.key === 'Enter') guardarPrecio(state.editandoPrecio);
    });
  }
  const smi = document.getElementById('scanner-manual-input');
  if (smi) {
    smi.addEventListener('keydown', e => {
      if (e.key === 'Enter') buscarCodigoManual();
    });
  }
}

function handleClick(e) {
  const action = e.currentTarget.dataset.action;
  const d = e.currentTarget.dataset;
  switch(action) {
    case 'setVista': setVista(d.vista); break;
    case 'setMes': setMes(d.mes); break;
    case 'toggleExp': toggleExpandido(d.key); break;
    case 'iniciarPrecio': iniciarEditarPrecio(d.key); break;
    case 'guardarPrecio': guardarPrecio(d.key); break;
    case 'togglePago': togglePago(d.servicio, d.cid, d.mes); break;
    case 'abrirModal': abrirModal(d.servicio, d.cid); break;
    case 'cerrarModal':
      if (e.target === e.currentTarget) cerrarModal();
      break;
    case 'setTipoPago': actualizarForm('tipoPago', d.tipo); break;
    case 'guardarCliente': guardarCliente(); break;
    case 'eliminarCliente':
      e.stopPropagation();
      eliminarCliente(d.servicio, d.cid);
      break;
    case 'abrirModalProducto':
      e.stopPropagation();
      abrirModalProducto(d.pid, d.categoria);
      break;
    case 'setCategoriaProducto': actualizarFormProducto('categoria', d.categoria); render(); break;
    case 'toggleProdExp':
      e.stopPropagation();
      toggleProductoExpandido(d.pid);
      break;
    case 'toggleVentasProducto':
      e.stopPropagation();
      toggleVentasProducto(d.pid);
      break;
    case 'cerrarModalProducto':
      if (e.target === e.currentTarget) cerrarModalProducto();
      break;
    case 'guardarProducto': guardarProducto(); break;
    case 'eliminarProducto':
      e.stopPropagation();
      eliminarProducto(d.pid);
      break;
    case 'abrirModalVenta':
      e.stopPropagation();
      abrirModalVenta(d.pid, d.tam || null);
      break;
    case 'cerrarModalVenta':
      if (e.target === e.currentTarget) cerrarModalVenta();
      break;
    case 'registrarVenta': registrarVenta(d.pid, d.tam || null); break;
    case 'abrirScannerVenta': abrirScannerVenta(); break;
    case 'abrirScannerAsignar': abrirScannerAsignar(); break;
    case 'cerrarScanner':
      if (e.target === e.currentTarget) cerrarScanner();
      break;
    case 'buscarCodigoManual': buscarCodigoManual(); break;
    case 'intentarLogin': intentarLogin(d.rol); break;
    case 'cerrarSesion': cerrarSesion(); break;
  }
}

// ============== INIT ==============
cargarLocal();
render();
revisarYNotificar(); // por si ya había permiso concedido de antes

// El módulo de Firebase carga por separado y puede tardar un poco más que
// el resto del código; esperamos a que avise que ya está listo.
if (window.nubeListo) {
  sincronizarNube();
} else {
  window.addEventListener('nube-lista', () => sincronizarNube(), { once: true });
}

// Le pedimos al navegador que marque el almacenamiento como "persistente":
// esto reduce (no elimina del todo) el riesgo de que Android borre los datos
// solo para liberar espacio. No evita que el usuario borre los datos a mano
// desde Ajustes, ni sustituye al respaldo — es una capa extra de protección.
if (navigator.storage && navigator.storage.persist) {
  navigator.storage.persist().catch(() => {});
}

// BUG FIX: si la app se queda abierta en segundo plano y cambia el día (o el mes),
// el selector de mes y los "pagos por vencer" quedaban congelados con la fecha de
// cuando se abrió la app. Revisamos cada minuto si cambió el día y volvemos a pintar.
let ultimoDiaConocido = new Date().toDateString();
setInterval(() => {
  const ahora = new Date().toDateString();
  if (ahora !== ultimoDiaConocido) {
    ultimoDiaConocido = ahora;
    render();
  }
}, 60000);

// Revisa membresías por vencer cada hora mientras la app esté abierta y avisa
// con una notificación si ya se dieron permisos.
setInterval(() => { revisarYNotificar(); }, 60 * 60 * 1000);

// ============== PWA: Service Worker ==============
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.protocol === 'http:')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.log('SW error:', err));
  });
}
</script>
</body>
</html>
